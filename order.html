<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>NEXUS LABS | 나의 작업</title><link rel="stylesheet" href="styles.css"><style>.order-wrap{max-width:800px;margin:40px auto;padding:20px}.card{background:white;padding:28px;border:1px solid #dce2ed;border-radius:18px;margin:20px 0}.order-form{display:grid;gap:14px}.order-form input:not([type=checkbox]),.order-form select,.order-form textarea{width:100%;padding:12px;font:inherit;border:1px solid #bfc9d8;border-radius:9px;box-sizing:border-box}.order-form label{line-height:1.6}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{cursor:pointer}.download{display:inline-block;margin:6px;padding:10px;background:#eef2fa;border-radius:8px}#status{font-weight:600}.preview-frame{width:100%;height:260px;border:1px solid #dce2ed;border-radius:10px}[hidden]{display:none!important}</style></head><body><header><a class="brand" href="./">NEXUS <b>LABS</b></a><a href="support.html">Q&A · 문의</a></header><main class="order-wrap"><h1>신청부터 결과 확인까지</h1><p>원하는 작업을 알려 주세요. 접수 후 나만의 링크에서 미리보기와 진행 상태를 확인할 수 있습니다.</p><section class="card" id="new-order"><form id="order-form" class="order-form"><label>이름 또는 회사명<input name="customer_name" required maxlength="100" autocomplete="name"></label><label>답변받을 이메일<input name="contact" type="email" required maxlength="200" autocomplete="email"></label><label>원하는 서비스<select name="service_type"><option value="website">홈페이지 제작</option><option value="ai_automation">업무 자동화</option><option value="custom_system">맞춤 시스템</option><option value="consulting">도입 상담</option></select></label><label>원하는 작업<textarea name="description" required maxlength="5000" rows="5" placeholder="필요한 화면과 기능을 적어 주세요. 비밀번호·API 키는 입력하지 마세요."></textarea></label><label><input type="checkbox" name="privacy_consent" required> <a href="privacy.html">개인정보 수집·이용 안내</a>에 동의합니다.</label><label><input type="checkbox" name="transfer_consent" required> 안내된 국외 전송·보관에 동의합니다.</label><button class="btn" type="submit">신청하고 미리보기 확인</button></form></section><p id="message" role="status" aria-live="polite"></p><section id="my-order" class="card" hidden><h2 id="receipt"></h2><p id="status"></p><p>이 페이지의 전용 링크를 보관하세요. 링크를 가진 사람은 공개된 결과를 볼 수 있으므로 타인에게 공유하지 마세요.</p><p id="preview"></p><a id="demo" class="btn" href="preview.html">기능 미리보기 체험</a><p>견적을 확인한 뒤 입금하면 관리자가 실제 입금 내역을 확인합니다. AI 실행은 작업 환경과 비용 승인 준비 후 시작됩니다.</p><a href="deposit.html">입금 안내</a><button id="refresh-order" class="btn" type="button">진행 상태 확인</button><section id="deliverables" hidden><h2>완성된 작업 결과</h2><p id="result-summary"></p><div id="result-downloads"></div><iframe id="result-preview" class="preview-frame" title="결과물의 제한된 미리보기" sandbox="" hidden></iframe></section></section></main><script src="config.js"></script><script type="module" src="order.js"></script></body></html>
