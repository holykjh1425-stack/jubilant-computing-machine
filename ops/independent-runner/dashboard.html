<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOLQ COMMAND · 워커 현황</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:#0b1324;color:#eaf4ff}header{padding:24px;background:#13213a}h1{margin:0;font-size:26px}small,p{color:#aabbd2}.wrap{max-width:1120px;margin:auto;padding:18px}.notice{padding:14px;border:1px solid #52617a;border-radius:12px;margin:16px 0}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat,.worker{background:#15233c;border:1px solid #30445f;border-radius:14px;padding:16px}.stat{min-width:115px}.stat strong{font-size:25px;display:block}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px;margin-top:18px}.worker h2{font-size:19px;margin:0 0 8px}.worker p{margin:4px 0 12px;font-size:13px}.task{padding:8px 0;border-top:1px solid #30445f;font-size:13px}.pill{font-size:12px;padding:3px 8px;border-radius:20px;background:#344158;white-space:nowrap}.done{background:#145640}.ready{background:#155477}.blocked{background:#674522}.meta{font-size:12px;color:#9bb0ca}a{color:#70e3ff}button{border:1px solid #4c6687;border-radius:8px;background:#183351;color:white;padding:9px;cursor:pointer}</style></head><body><header><div class="wrap"><h1>SOLQ COMMAND</h1><p>ATLAS 총괄 · 전담 워커 작업 현황</p></div></header><main class="wrap"><div class="notice">이 화면은 GitHub 개발 브랜치의 작업 장부를 <b>읽기 전용</b>으로 표시합니다. 역할 이름은 실제 가동 중인 독립 AI 에이전트를 뜻하지 않습니다. 운영 홈페이지와 분리된 화면입니다.</div><div class="stats" id="stats"></div><p id="sync">작업 장부를 불러오는 중…</p><button onclick="load()">새로고침</button><section class="grid" id="workers"></section><p class="meta">GitHub 공개 저장소의 작업 상태를 표시하므로 고객정보·비밀키를 입력하지 마세요. GitHub API가 제한되면 현황을 표시할 수 없습니다.</p></main><script>
const names=[["ATLAS","아틀라스","총괄 지휘·업무 배정"],["FIN","핀","재정·합법적 절세"],["CORE","코어","홈페이지·고객 접수"],["AUTO","오토","AI 자동화·비용 통제"],["GUARD","가드","검증·백업·복원"],["SENTINEL","센티넬","해킹 방어·침해 대응"],["GROW","그로우","광고·마케팅"],["INNO","이노","연구법인·특허"],["EDU","에듀","평생교육·교육상품"],["ESTATE","에스테이트","부동산·상업시설"],["MODU","모듈","모듈러주택 대리점"],["CARE","케어","교회·비영리 회계"]];
const repo="holykjh1425-stack/jubilant-computing-machine",branch="dev/solq-independent-runner-20261102",path="ops/independent-runner/tasks.json";
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
async function load(){const status=document.getElementById("sync");status.textContent="GitHub에서 읽는 중…";try{const url="https://api.github.com/repos/"+repo+"/contents/"+path+"?ref="+encodeURIComponent(branch);const res=await fetch(url,{headers:{"Accept":"application/vnd.github.raw+json"},cache:"no-store"});if(!res.ok)throw Error("GitHub HTTP "+res.status);const data=JSON.parse(await res.text());const tasks=data.tasks||[];const counts={done:0,ready:0,blocked:0,in_progress:0,needs_review:0};tasks.forEach(t=>counts[t.status]=(counts[t.status]||0)+1);const stats=document.getElementById("stats");stats.replaceChildren();for(const [label,val] of [["전체",tasks.length],["완료",counts.done],["대기",counts.ready],["진행",counts.in_progress],["차단",counts.blocked],["검토 필요",counts.needs_review]]){const s=el("div","stat");s.append(el("strong","",String(val)),el("span","",label));stats.append(s)}const grid=document.getElementById("workers");grid.replaceChildren();for(const [id,name,role] of names){const card=el("article","worker");card.append(el("h2","",name+" · "+id),el("p","",role));const owned=tasks.filter(t=>t.owner===id);if(!owned.length)card.append(el("div","meta","배정된 작업 없음 · 역할 준비"));for(const t of owned){const item=el("div","task");item.append(el("span","pill "+t.status,t.status),document.createTextNode(" "+t.id+" · "+t.title));card.append(item)}grid.append(card)}status.textContent="최종 조회: "+new Date().toLocaleString("ko-KR")+" · 장부 기준: "+(data.updated_at||"미기록")+" · 자동 갱신 아님";}catch(e){status.textContent="조회 실패: "+e.message+" · GitHub에서 직접 확인해 주세요."}}
load();
</script></body></html>
