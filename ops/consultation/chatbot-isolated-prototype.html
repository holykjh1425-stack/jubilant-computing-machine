<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOLQ 상담 챗봇 격리 시제품</title><style>body{font:16px system-ui,sans-serif;max-width:700px;margin:32px auto;padding:16px;background:#f7f8fb;color:#182235}main{background:white;padding:24px;border-radius:18px;box-shadow:0 4px 24px #0001}button,select,input{font:inherit;padding:12px;margin:8px 0;border:1px solid #ccd3df;border-radius:9px}button{background:#1439ad;color:white;cursor:pointer}button:focus,input:focus{outline:3px solid #a4b7fa}.log{padding:12px;background:#f2f5fc;min-height:90px;white-space:pre-wrap;border-radius:9px}label{display:block;margin-top:10px}.note{font-size:13px;color:#526077}</style></head><body><main><h1>SOLQ 무료 상담 도우미</h1><p>서비스와 필요한 기능을 선택하면 예상 범위와 다음 질문을 안내합니다.</p><p class="note">격리 시제품입니다. 답변은 이 브라우저 화면에만 유지되며 서버에 저장하거나 전송하지 않습니다. 이름·전화번호·이메일·민감정보를 입력하지 마세요.</p><div class="log" id="reply" role="status" aria-live="polite">안녕하세요. 어떤 홈페이지 또는 업무자동화가 필요하신가요?</div><label>업종<select id="sector"><option value="">선택</option><option value="church">교회</option><option value="store">소상공인·매장</option><option value="company">일반기업</option><option value="education">교육기관</option><option value="estate">부동산·모듈러주택</option><option value="automation">AI 업무자동화</option><option value="other">기타</option></select></label><label>관리자에서 직접 수정할 필요<select id="admin"><option value="">선택</option><option value="yes">예</option><option value="no">아니요</option><option value="unsure">잘 모르겠음</option></select></label><label>필요한 기능<select id="feature"><option value="">선택</option><option>소개·안내</option><option>공지·주보·게시판</option><option>예약·신청</option><option>회원가입·로그인</option><option>결제</option><option>외부 시스템 연동</option><option>AI 자동화</option></select></label><label>희망 예산<select id="budget"><option value="">선택</option><option>30만원 이하</option><option>30~50만원</option><option>50~100만원</option><option>100만원 초과</option><option>미정</option></select></label><label>희망 일정<select id="timeline"><option value="">선택</option><option>2주 이내</option><option>1개월 이내</option><option>2~3개월</option><option>미정</option></select></label><button id="ask">무료 사전 안내 받기</button><button id="copy" type="button">상담 요약 복사</button><p class="note">정식 상담 신청은 <a href="../../index.html#apply">기존 SOLQ 신청 양식</a>에서 개인정보 동의 후 진행해 주세요. 이 시제품은 정식 신청을 자동 생성하지 않습니다.</p></main><script>const $=id=>document.getElementById(id);let summary='';$('ask').onclick=()=>{const s=$('sector').value,a=$('admin').value,f=$('feature').value,b=$('budget').value,t=$('timeline').value;if(!s){$('reply').textContent='먼저 업종을 선택해 주세요.';return}let p='업종과 기능에 따라 개별 견적이 필요합니다.';if(s==='church'){p=a==='yes'?'교회 관리자형 39만원 또는 맞춤형 90만원부터(제안가격) 검토 가능합니다.':'교회 소개형 25만원(제안가격) 검토 가능합니다.';if(['결제','회원가입·로그인','외부 시스템 연동'].includes(f))p='선택한 기능은 별도 보안·개발 검토가 필요하므로 개별 견적입니다.'}else if(s==='automation'){p='AI 업무자동화 기본형 10만원부터이며, 생성형 AI·외부 연동은 별도 견적입니다.'}summary='업종: '+$('sector').selectedOptions[0].text+'\n관리자: '+(a||'미선택')+'\n기능: '+(f||'미선택')+'\n예산: '+(b||'미선택')+'\n일정: '+(t||'미선택');$('reply').textContent=p+'\n\n'+summary+'\n\n다음 확인 사항: 필요한 페이지 수, 제공 가능한 사진·문구, 기존 도메인 유무.\n\n금액은 확정 견적이 아니며, 계약·결제는 별도 승인 후 진행합니다.'};$('copy').onclick=async()=>{if(!summary){$('reply').textContent='먼저 사전 안내를 받아 주세요.';return}try{await navigator.clipboard.writeText(summary);$('reply').textContent+='\n\n상담 요약이 복사되었습니다.'}catch(e){$('reply').textContent+='\n\n복사가 지원되지 않습니다. 화면의 요약을 직접 복사해 주세요.'}}</script></body></html>
