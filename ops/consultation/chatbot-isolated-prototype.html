<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOLQ 업종별 상담 도우미 · 격리 시제품</title><style>
body{font:16px/1.6 system-ui,sans-serif;background:#f5f7fb;color:#1a2740;margin:0;padding:22px}main{max-width:740px;margin:auto;background:white;border-radius:18px;padding:24px;box-shadow:0 8px 28px #14254b15}h1{font-size:1.5rem}button,input,select{font:inherit;padding:11px;border:1px solid #bcc8dc;border-radius:9px}button{background:#1945b5;color:white;cursor:pointer;margin:7px 7px 7px 0}button:disabled{opacity:.5}label{display:block;margin-top:15px;font-weight:600}select,input{display:block;width:100%;box-sizing:border-box}#conversation{background:#eef3fb;padding:16px;border-radius:12px;min-height:130px;white-space:pre-wrap}small,.note{color:#566477}a{color:#1945b5}button:focus,select:focus,input:focus{outline:3px solid #a5bafa}</style></head>
<body><main><h1>SOLQ 무료 상담 도우미</h1><p>안녕하세요. 찾아주셔서 감사합니다. 업종을 알려주시면 필요한 사항을 하나씩 여쭙고 적합한 제작 방향을 안내하겠습니다.</p><p class="note">개발 브랜치 격리 시제품 · AI API 미사용 · 대화 서버 저장 없음 · 계약·결제 자동 실행 없음</p>
<div id="conversation" role="status" aria-live="polite">업종을 선택해 주세요.</div>
<label for="sector">업종</label><select id="sector"><option value="">선택해 주세요</option></select>
<div id="question-area" hidden><label id="question-label" for="answer"></label><input id="answer" maxlength="240" autocomplete="off" placeholder="개인정보 없이 간단히 입력해 주세요"><button id="next" type="button">다음 질문</button><button id="skip" type="button">건너뛰기</button></div>
<div id="result" hidden><h2>상담 안내 결과</h2><div id="summary" role="status" aria-live="polite"></div><button id="copy" type="button">상담 내용 복사</button><button id="restart" type="button">다시 상담하기</button><p>정식 신청은 <a href="../../index.html#apply">기존 SOLQ 신청 양식</a>에서 개인정보 안내와 동의 확인 후 진행해 주세요.</p></div>
<p class="note">비밀번호·주민등록번호·헌금자 명단·결제정보 등 민감정보는 입력하지 마세요. 상담 답변은 브라우저 메모리에만 유지되며 전송되지 않습니다.</p>
</main><script>
'use strict';
const $=id=>document.getElementById(id);let catalog=null,sector=null,index=0,answers=[],output='';
const money=n=>Number(n).toLocaleString('ko-KR')+'원';
const clean=s=>String(s).replace(/[<>]/g,'').trim().slice(0,240);
function displayQuestion(){const q=sector.questions[index];$('question-area').hidden=false;$('question-label').textContent='질문 '+(index+1)+' / '+sector.questions.length+' — '+q;$('answer').value='';$('answer').focus();$('conversation').textContent=sector.greeting+'\n\n'+q}
function finish(){const proposals=sector.offers.map(o=>o.label+': '+(o.price_krw?money(o.price_krw):money(o.price_from_krw)+'부터')+' ('+o.when+')');const risk=sector.complex.some(w=>answers.some(a=>a.value.includes(w)));let lines=['상담해 주셔서 감사합니다. 말씀해 주신 내용을 기준으로 안내드립니다.','',...answers.map(a=>a.question+'\n→ '+(a.value||'미정')),'','[제작비 안내]',...(proposals.length?proposals:['필요한 기능을 확인한 후 개별 견적을 안내드리겠습니다.'])];if(risk)lines.push('선택하신 기능 중 별도 보안·개발 검토가 필요한 항목이 있어 개별 견적이 필요합니다.');if(sector.monthly_maintenance_krw)lines.push('선택 유지관리 제안: 월 '+money(sector.monthly_maintenance_krw));lines.push('','※ '+catalog.policies.price_disclaimer,'※ 부가세·도메인·호스팅 등 별도 비용은 확인 후 안내합니다.','※ 상담만으로 계약·결제·제작이 시작되지 않습니다.','', '추가로 필요한 자료: 제작 목적, 페이지 수, 사진·문구 제공 여부, 관리자 필요 여부, 예산·희망 일정.','정식 상담 신청은 기존 신청 양식을 이용해 주세요.');output=lines.join('\n');$('summary').textContent=output;$('conversation').textContent='요청하신 내용을 정리했습니다. 아래에서 안내 결과를 확인해 주세요.';$('question-area').hidden=true;$('result').hidden=false}
function next(skip=false){if(!sector)return;const value=skip?'미정':clean($('answer').value);if(!value){$('conversation').textContent='답변이 아직 비어 있습니다. 간단히 작성하시거나 건너뛰기를 선택해 주세요.';return}answers.push({question:sector.questions[index],value});index++;if(index<sector.questions.length)displayQuestion();else finish()}
$('next').onclick=()=>next();$('skip').onclick=()=>next(true);$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();next()}});
$('sector').onchange=()=>{sector=catalog.sectors[$('sector').value];index=0;answers=[];output='';$('result').hidden=true;if(sector)displayQuestion();else{$('question-area').hidden=true;$('conversation').textContent='업종을 선택해 주세요.'}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(output);$('conversation').textContent='상담 요약을 복사했습니다. 정식 접수 시 필요한 내용만 신청 양식에 입력해 주세요.'}catch(e){$('conversation').textContent='자동 복사가 지원되지 않습니다. 아래 내용을 직접 복사해 주세요.'}};
$('restart').onclick=()=>{$('sector').value='';$('sector').onchange()};
fetch('./sector-catalog.candidate.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('catalog unavailable');return r.json()}).then(data=>{if(data.status!=='internal_candidate_not_approved_for_public_pricing'||!data.sectors)throw Error('invalid catalog');catalog=data;for(const [key,s] of Object.entries(data.sectors)){$('sector').add(new Option(s.label,key))}$('conversation').textContent='어서 오세요. 어떤 업종의 홈페이지 또는 업무자동화를 준비하고 계신가요?'}).catch(()=>{$('conversation').textContent='상담 매뉴얼을 불러오지 못했습니다. 잠시 후 다시 시도하거나 기존 신청 양식을 이용해 주세요.';$('sector').disabled=true});
</script></body></html>
