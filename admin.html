<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS LABS Admin</title><link rel="stylesheet" href="styles.css"><style>.wrap{padding:45px max(4vw,18px)}.panel{padding:22px;background:#0e1d2e;border:1px solid #24374b;border-radius:12px;margin-top:20px}.form{display:grid;gap:12px;max-width:420px}.form input{padding:12px;background:#07111f;color:white;border:1px solid #2a4158;border-radius:7px}table{border-collapse:collapse;width:100%;min-width:780px;font-size:12px}td,th{text-align:left;padding:10px;border-bottom:1px solid #24374b;vertical-align:top}th{color:#61e4ee}.table-wrap{overflow:auto}.hidden{display:none}.status{background:#07111f;color:white;padding:7px;border:1px solid #24374b}.msg{color:#61e4ee}</style></head><body><header><a class="brand" href="./">NEXUS <b>LABS</b></a><a href="./">고객 페이지 ↗</a></header><main class="wrap"><small>PRIVATE WORKSPACE</small><h1 style="font-size:36px">신청 관리</h1><section id="login-panel" class="panel"><h2>관리자 로그인</h2><p>Supabase에서 관리자 계정을 만들고 허용 목록에 등록해야 합니다. 공개 가입은 제공하지 않습니다.</p><form id="login-form" class="form"><label>이메일<input type="email" name="email" required></label><label>비밀번호<input type="password" name="password" required></label><button class="btn">로그인 →</button></form><p id="login-msg" class="msg"></p></section><section id="data-panel" class="panel hidden"><button id="refresh" class="btn">새로고침</button> <button id="logout" class="btn">로그아웃</button><p id="data-msg" class="msg"></p><div class="table-wrap"><table><thead><tr><th>접수번호</th><th>접수일</th><th>고객</th><th>연락처</th><th>서비스</th><th>요청 내용</th><th>상태</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
