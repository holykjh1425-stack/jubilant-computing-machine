<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS LABS Admin</title><link rel="stylesheet" href="styles.css"><style>.wrap{padding:45px max(4vw,18px)}.panel{padding:22px;background:#fff;border:1px solid #dce2ed;border-radius:12px;margin-top:20px}.form{display:grid;gap:12px;max-width:420px}.form input{padding:12px;background:#fafbfe;color:#20243b;border:1px solid #c5cddd;border-radius:7px}table{border-collapse:collapse;width:100%;min-width:780px;font-size:12px}td,th{text-align:left;padding:10px;border-bottom:1px solid #dce2ed;vertical-align:top}th{color:#6556a7}.table-wrap{overflow:auto}.hidden{display:none}.status{background:#fafbfe;color:#20243b;padding:7px;border:1px solid #dce2ed}.msg{color:#6556a7}</style></head><body><header><a class="brand" href="./">NEXUS <b>LABS</b></a><a href="./">고객 신청서</a></header><main class="wrap"><small>PRIVATE WORKSPACE</small><h1 style="font-size:36px">신청 관리</h1><section id="login-panel" class="panel"><h2>관리자 로그인</h2><p>등록된 관리자 계정으로 로그인해 주세요.</p><form id="login-form" class="form"><label>이메일<input type="email" name="email" required></label><label>비밀번호<input type="password" name="password" required></label><button class="btn">로그인</button></form><p id="login-msg" class="msg"></p></section><section id="data-panel" class="panel hidden"><button id="refresh" class="btn">새로고침</button> <button id="logout" class="btn">로그아웃</button><p>새 신청 알림을 확인한 뒤 내용을 검토하고 상태를 변경해 주세요. 입금은 은행 알림·거래내역에서 입금자와 견적 금액을 대조한 후 ‘입금 확인’으로 변경합니다.</p><p class="msg">알림은 이 관리자 화면이 열린 동안 15초마다 확인합니다.</p><p id="data-msg" class="msg"></p><div class="table-wrap"><table><thead><tr><th>접수번호</th><th>접수일</th><th>고객</th><th>연락처</th><th>서비스</th><th>요청 내용</th><th>상태</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
