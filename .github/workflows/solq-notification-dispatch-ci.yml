name: SOLQ serverless notification delta verification
on:
  push:
    branches: [dev/solq-notifications-20261110]
    paths:
      - 'supabase/functions/solq-notification-dispatch/**'
      - 'supabase/functions/_shared/solq-notification-worker.mjs'
      - 'tests/notification-dispatch*'
      - '.github/workflows/solq-notification-dispatch-ci.yml'
permissions:
  contents: read
jobs:
  delta:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Only new dispatcher tests; reuse earlier 21 and PG17 race evidence
        run: node --test tests/notification-dispatch.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Check candidate Deno entry point without executing it
        run: deno check --config supabase/functions/solq-notification-dispatch/deno.json supabase/functions/solq-notification-dispatch/index.ts
      - name: Deno runtime with live network and environment access denied
        run: deno test --config supabase/functions/solq-notification-dispatch/deno.json --deny-net --deny-env tests/notification-dispatch-deno.mjs
