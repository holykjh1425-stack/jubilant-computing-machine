name: SOLQ actual local Supabase Auth Edge RLS integration only
on:
  push:
    branches: [dev/solq-cost-control-20261028]
    paths: [candidates/local-supabase/index.ts, candidates/local-supabase/schema.sql, tests/local-supabase/*.py, .github/workflows/solq-local-supabase.yml]
permissions:
  contents: read
jobs:
  local-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: '1'
      SOLQ_CLI: /tmp/solq-cli/supabase
      SOLQ_STACK_DIR: /tmp/solq-isolated-stack
      SOLQ_STACK_NETWORK: solq-local-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned official CLI with release SHA256
        run: |
          mkdir -p "/tmp/solq-cli" "$SOLQ_STACK_DIR"
          curl --fail --silent --show-error --location https://github.com/supabase/cli/releases/download/v2.122.0/supabase_2.122.0_linux_amd64.tar.gz --output "/tmp/solq-cli/cli.tar.gz"
          echo '59ed066847b98d7461c60e9109d40cab6b9756177ce06ebb05b51338519f5136  '"/tmp/solq-cli/cli.tar.gz" | sha256sum --check
          tar -xzf "/tmp/solq-cli/cli.tar.gz" -C "/tmp/solq-cli" supabase
          "$SOLQ_CLI" --version
      - name: Prepare local unlinked stack and loopback-only internal network
        run: |
          docker network create --internal --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 "$SOLQ_STACK_NETWORK"
          python3 tests/local-supabase/setup.py
      - name: Start real local Supabase without logging local credentials
        run: python3 tests/local-supabase/start.py
      - name: New actual Auth Edge RLS PostgREST integration checks only
        run: python3 tests/local-supabase/run.py
      - name: Destroy this run's local synthetic stack
        if: always()
        run: python3 tests/local-supabase/cleanup.py
