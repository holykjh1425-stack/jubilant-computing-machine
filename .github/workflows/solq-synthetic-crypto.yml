name: SOLQ synthetic public-key encryption only
on:
  push:
    branches: [dev/solq-automation-preservation-20261026]
    paths:
      - tests/backup-crypto/synthetic.py
      - .github/workflows/solq-synthetic-crypto.yml
permissions:
  contents: read
concurrency:
  group: solq-synthetic-crypto
  cancel-in-progress: false
jobs:
  synthetic-crypto:
    if: github.repository == 'holykjh1425-stack/jubilant-computing-machine'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Harden disposable synthetic runner against visible swapping
        run: |
          sudo swapoff -a
          test "$(wc -l < /proc/swaps)" -eq 1
      - name: Parse Windows preflight without executing it or accessing a PC
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'ops/windows-backup/Check-BackupTools.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw 'Windows preflight syntax failed' }
      - name: Run synthetic-only encryption/decryption; never accesses a database or user key
        run: python3 tests/backup-crypto/synthetic.py
      - name: Print non-secret synthetic result only
        run: cat tests/backup-crypto/results.json
