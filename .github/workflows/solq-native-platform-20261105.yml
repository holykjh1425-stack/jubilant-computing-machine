name: SOLQ native PG17 Auth Edge schema recovery
on:
  push:
    branches: [dev/solq-independent-runner-20261102]
    paths:
      - '.github/workflows/solq-native-platform-20261105.yml'
      - 'candidates/native-platform-20261105/**'
permissions:
  contents: read
concurrency:
  group: solq-native-platform-ci
  cancel-in-progress: false
jobs:
  native-platform:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DO_NOT_TRACK: '1'
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      SOLQ_CLI: /tmp/solq-native-cli/supabase
      SOLQ_STACK_DIR: /tmp/solq-native-stack
      SOLQ_STACK_NETWORK: solq-native-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare pinned existing CLI
        run: |
          mkdir -p /tmp/solq-native-cli "$SOLQ_STACK_DIR"
          curl --fail --silent --show-error --location https://github.com/supabase/cli/releases/download/v2.122.0/supabase_2.122.0_linux_amd64.tar.gz --output /tmp/solq-native-cli/cli.tar.gz
          echo '59ed066847b98d7461c60e9109d40cab6b9756177ce06ebb05b51338519f5136  /tmp/solq-native-cli/cli.tar.gz' | sha256sum --check
          tar -xzf /tmp/solq-native-cli/cli.tar.gz -C /tmp/solq-native-cli supabase
      - name: Prepare synthetic isolated PG17 stack
        run: |
          docker network create --internal --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 "$SOLQ_STACK_NETWORK"
          python3 candidates/native-platform-20261105/setup.py
      - name: Start actual local services through existing corrected route
        run: python3 candidates/environment-recovery-20261101/start.py
      - name: Actual historical schema and Auth PostgREST Edge integration
        run: python3 candidates/native-platform-20261105/run.py
      - name: Destroy only disposable local stack
        if: always()
        run: |
          if [ -f "$SOLQ_STACK_DIR/supabase/config.toml" ] && [ -x "$SOLQ_CLI" ]; then
            python3 tests/local-supabase/cleanup.py
          fi
          sudo python3 -c "from pathlib import Path;p=Path('/etc/hosts');p.write_text('\\n'.join(l for l in p.read_text().splitlines() if '# SOLQ-CI-ROUTE-' not in l)+'\\n')"
      - name: Preserve sanitized synthetic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: solq-native-platform-synthetic-results
          path: candidates/native-platform-20261105/results.json
          if-no-files-found: warn
          retention-days: 1
