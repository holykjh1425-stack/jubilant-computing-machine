name: SOLQ isolated privilege hardening
on:
  push:
    branches: [dev/solq-automation-preservation-20261026]
    paths:
      - tests/privilege-hardening/**
      - ops/residual-validation/admin-users-grants-candidate.sql
      - .github/workflows/solq-privilege-hardening.yml
permissions:
  contents: read
concurrency:
  group: solq-privilege-hardening
  cancel-in-progress: false
jobs:
  grants:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SOLQ_TEST_CONTAINER: solq-grants-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Create network-isolated synthetic database
        run: |
          docker run --detach --name "$SOLQ_TEST_CONTAINER" --network none --tmpfs /var/lib/postgresql/data -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=solq_grants postgres:17.11
          for attempt in $(seq 1 30); do
            if docker exec "$SOLQ_TEST_CONTAINER" pg_isready -U postgres -d solq_grants; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: python3 tests/privilege-hardening/run.py
      - if: always()
        run: docker rm --force "$SOLQ_TEST_CONTAINER"
