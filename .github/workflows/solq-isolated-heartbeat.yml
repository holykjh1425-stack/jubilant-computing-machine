name: SOLQ isolated heartbeat (candidate)
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: read
concurrency:
  group: solq-isolated-heartbeat
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic heartbeat
        run: python3 ops/independent-runner/heartbeat_probe.py --output artifacts/heartbeat.json --run-id "${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/heartbeat.json
          retention-days: 7
