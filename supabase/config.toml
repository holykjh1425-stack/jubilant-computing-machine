project_id = "nexus-labs"

[functions.nexus-ai]
verify_jwt = true

[functions.nexus-orchestrator]
verify_jwt = true

# Machine-only endpoint authenticates its narrow Vault worker token in its handler.
[functions.nexus-agent-worker]
verify_jwt = false

# Public intake/capability portal; admin and machine actions authenticate in the handler.
[functions.nexus-production]
verify_jwt = false
